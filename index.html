<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Safex - 下载</title>

  <link rel="icon" href="./app-icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="./app-icon-512.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.05) 0px, transparent 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 32px;
      padding: 40px 32px 32px;
      text-align: center;
      box-shadow: 
        0 20px 40px -15px rgba(15, 23, 42, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .app-icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .app-icon-wrapper::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: -4px;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      filter: blur(20px);
      opacity: 0.35;
      border-radius: 24px;
      z-index: 1;
    }

    .app-icon {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      object-fit: cover;
      background: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.1);
    }

    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .app-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.5;
      font-weight: 400;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border-radius: 18px;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-download:hover {
      box-shadow: 0 14px 28px -4px rgba(37, 99, 235, 0.5);
      transform: translateY(-1px);
    }

    .btn-download:active {
      transform: scale(0.98) translateY(0);
      box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.4);
    }

    .btn-download svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .info-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(226, 232, 240, 0.8);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-item {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .version-tag {
      display: inline-block;
      margin-top: 12px;
      font-size: 11px;
      color: #0284c7;
      background: rgba(186, 230, 253, 0.4);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
      align-self: center;
    }

    @media (max-height: 650px) {
      body {
        align-items: flex-start;
      }
      .card {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="app-icon-wrapper">
      <img id="appIcon" src="./app-icon-512.png" alt="Safex" class="app-icon">
    </div>

    <h1 class="app-name" id="appName">Safex</h1>
    <p class="app-desc" id="appDesc">免费使用的聊天软件</p>

    <a id="downloadBtn" class="btn-download" href="https://github.com/Bei18/Safex/releases/download/v1.0.0/safex.apk">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
      <span>下载应用</span>
    </a>

    <div class="info-section">
      <p class="info-item">Android 应用安装包</p>
      <p class="info-item">下载后请按照系统提示完成安装</p>
      <span class="version-tag" id="appVersion">v1.1.5</span>
    </div>
  </main>

  <script>
    const APP_CONFIG = {
      appName: "Safex",
      appDesc: "免费使用的聊天软件",
      appIcon: "./app-icon-512.png",
      downloadUrl: "https://github.com/Bei18/Safex/releases/download/v1.0.0/safex.apk",
      version: "v1.1.5",
      pageTitle: "Safex - 下载"
    };

    function initPage() {
      document.title = APP_CONFIG.pageTitle;

      const appIcon = document.getElementById("appIcon");
      if (appIcon) appIcon.src = APP_CONFIG.appIcon;

      const appName = document.getElementById("appName");
      if (appName) appName.textContent = APP_CONFIG.appName;

      const appDesc = document.getElementById("appDesc");
      if (appDesc) appDesc.textContent = APP_CONFIG.appDesc;

      const downloadBtn = document.getElementById("downloadBtn");
      if (downloadBtn) downloadBtn.href = APP_CONFIG.downloadUrl;

      const appVersion = document.getElementById("appVersion");
      if (appVersion) appVersion.textContent = APP_CONFIG.version;
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initPage);
    } else {
      initPage();
    }
  </script>

</body>
</html>
